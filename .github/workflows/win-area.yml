name: win-area

on:
  pull_request:

jobs:
  area:
    name: area ${{ matrix.shard }}
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    defaults:
      run:
        shell: bash
    steps:
      - run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
          bash_path=$(cygpath -w /usr/bin/bash)
          echo "npm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
          echo "pnpm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install
      - env:
          SHARD: ${{ matrix.shard }}
        run: |
          mapfile -t list < <(find src/verify src/capture src/formal -name '*.test.ts' | sort | awk -v s="$SHARD" 'NR % 6 == s')
          node --test --test-timeout=240000 --test-reporter=spec "${list[@]}"
