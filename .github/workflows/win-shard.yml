name: win-shard

on:
  pull_request:

jobs:
  shard:
    name: shard 8 per file
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
          bash_path=$(cygpath -w /usr/bin/bash)
          echo "npm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
          echo "pnpm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install
      - env:
          SHARD: 8
          TOTAL: 8
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          pnpm run --silent ci:shard > "$RUNNER_TEMP/list.txt"
          run_one() {
            file="$1"
            log="$RUNNER_TEMP/out/$(echo "$file" | tr '/' '_').log"
            timeout 300 node --test --test-reporter=spec "$file" > "$log" 2>&1
            echo "FILE $file exit $?"
          }
          export -f run_one
          export RUNNER_TEMP
          xargs -P 3 -I{} bash -c 'run_one {}' < "$RUNNER_TEMP/list.txt" | tee "$RUNNER_TEMP/summary.txt"
          for log in "$RUNNER_TEMP"/out/*.log; do
            echo "=================== $log"
            cat "$log"
          done
          ! grep -v "exit 0$" "$RUNNER_TEMP/summary.txt"
