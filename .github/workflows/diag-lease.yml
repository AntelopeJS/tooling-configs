name: diag-lease
on:
  push:
    branches: [ci/windows-lease]
jobs:
  lease:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
          bash_path=$(cygpath -w /usr/bin/bash)
          echo "npm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
          echo "pnpm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install
      - env:
          SHARD: 4
          TOTAL: 8
        timeout-minutes: 15
        run: |
          files=$(pnpm run --silent ci:shard)
          mapfile -t list <<< "$files"
          for f in "${list[@]}"; do
            start=$SECONDS
            code=0
            timeout 100 node --test --test-reporter=dot "$f" > "$RUNNER_TEMP/out.txt" 2>&1 || code=$?
            echo "== $f exit=$code seconds=$((SECONDS - start))"
          done
