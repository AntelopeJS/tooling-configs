name: diag-lease
on:
  push:
    branches: [ci/windows-lease]
jobs:
  lease:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
          bash_path=$(cygpath -w /usr/bin/bash)
          echo "npm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
          echo "pnpm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install
      - timeout-minutes: 8
        run: node --test --test-timeout=90000 --test-reporter=spec src/lease/run.test.ts
      - if: always()
        timeout-minutes: 12
        run: node --test --test-timeout=90000 --test-reporter=spec "src/lease/*.test.ts"
