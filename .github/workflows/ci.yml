name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  verify:
    name: verify${{ matrix.os == 'windows-latest' && ' on Windows' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'merge_group' || github.event_name == 'schedule') && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Use LF line endings, symlinks and Git Bash for package scripts
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
          bash_path=$(cygpath -w /usr/bin/bash)
          echo "npm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
          echo "pnpm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install
      - run: pnpm run checks
        env:
          ANTELOPEJS_CHECKS_SKIP: test
      - run: pnpm run --silent ci:weights:check

  test:
    name: test (${{ matrix.shard }})${{ matrix.os == 'windows-latest' && ' on Windows' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'merge_group' || github.event_name == 'schedule') && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]') }}
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    defaults:
      run:
        shell: bash
    steps:
      - name: Use LF line endings, symlinks and Git Bash for package scripts
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
          bash_path=$(cygpath -w /usr/bin/bash)
          echo "npm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
          echo "pnpm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: pnpm install
      - name: Point the lease tests at the runner's MongoDB
        if: runner.os == 'Windows'
        run: |
          mongod=$(ls /c/Program\ Files/MongoDB/Server/*/bin/mongod.exe | tail -n 1)
          echo "MONGOMS_SYSTEM_BINARY=$(cygpath -w "$mongod")" >> "$GITHUB_ENV"
      - name: Download a mongod for the lease tests
        if: runner.os == 'Linux'
        run: |
          mongod=$(node --input-type=module -e 'import { MongoBinary } from "mongodb-memory-server"; console.log(await MongoBinary.getPath())' | tail -n 1)
          echo "MONGOMS_SYSTEM_BINARY=$mongod" >> "$GITHUB_ENV"
      - env:
          SHARD: ${{ matrix.shard }}
          TOTAL: 8
        run: |
          files=$(pnpm run --silent ci:shard)
          mapfile -t list <<< "$files"
          node --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=./src/ci/file-reporter.ts \
            --test-reporter-destination="$RUNNER_TEMP/durations.json" \
            "${list[@]}"
      - if: ${{ !cancelled() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-durations-${{ matrix.shard }}
          path: ${{ runner.temp }}/durations.json
          if-no-files-found: ignore
          retention-days: 14

  checks:
    name: ci / checks
    if: always()
    needs: [verify, test]
    runs-on: ubuntu-latest
    steps:
      - run: test "$VERIFY" = success && test "$TEST" = success
        env:
          VERIFY: ${{ needs.verify.result }}
          TEST: ${{ needs.test.result }}

  legacy-checks:
    name: checks
    if: always()
    needs: [checks]
    runs-on: ubuntu-latest
    steps:
      - run: test "$CHECKS" = success
        env:
          CHECKS: ${{ needs.checks.result }}

  docs:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'merge_group' || github.event_name == 'schedule') && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]') }}
        node: ["22.18.0", "24"]
    defaults:
      run:
        shell: bash
    steps:
      - name: Use LF line endings, symlinks and Git Bash for package scripts
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
          bash_path=$(cygpath -w /usr/bin/bash)
          echo "npm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
          echo "pnpm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm ci --prefix actions/docs --ignore-scripts --no-audit --no-fund
      - run: |
          vale_bin=$(actions/docs/install-vale.sh "$RUNNER_TEMP/vale")
          echo "VALE_BIN=$vale_bin" >> "$GITHUB_ENV"
      - run: npm test --prefix actions/docs
      - uses: ./actions/docs

  verdict:
    needs: [verify, test, checks, legacy-checks, docs]
    if: ${{ always() }}
    runs-on: ${{ vars.RUNNER_CI || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail when a job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            echo "$failed"
            exit 1
          fi
