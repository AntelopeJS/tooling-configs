name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    name: verify${{ matrix.os == 'windows-latest' && ' on Windows' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Use LF line endings, symlinks and Git Bash for package scripts
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
          bash_path=$(cygpath -w /usr/bin/bash)
          echo "npm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
          echo "pnpm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install
      - run: pnpm run checks
        env:
          ANTELOPEJS_CHECKS_SKIP: test
      - run: pnpm run --silent ci:weights:check

  test:
    name: test (${{ matrix.shard }})${{ matrix.os == 'windows-latest' && ' on Windows' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    defaults:
      run:
        shell: bash
    steps:
      - name: Use LF line endings, symlinks and Git Bash for package scripts
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
          bash_path=$(cygpath -w /usr/bin/bash)
          echo "npm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
          echo "pnpm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install
      - env:
          SHARD: ${{ matrix.shard }}
          TOTAL: 8
        run: |
          files=$(pnpm run --silent ci:shard)
          mapfile -t list <<< "$files"
          node --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=./src/ci/file-reporter.ts \
            --test-reporter-destination="$RUNNER_TEMP/durations.json" \
            "${list[@]}"
      - if: ${{ !cancelled() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-durations-${{ matrix.shard }}
          path: ${{ runner.temp }}/durations.json
          if-no-files-found: ignore
          retention-days: 14

  checks:
    name: ci / checks
    if: always()
    needs: [verify, test]
    runs-on: ubuntu-latest
    steps:
      - run: test "$VERIFY" = success && test "$TEST" = success
        env:
          VERIFY: ${{ needs.verify.result }}
          TEST: ${{ needs.test.result }}

  legacy-checks:
    name: checks
    if: always()
    needs: [checks]
    runs-on: ubuntu-latest
    steps:
      - run: test "$CHECKS" = success
        env:
          CHECKS: ${{ needs.checks.result }}

  docs:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["22.18.0", "24"]
    defaults:
      run:
        shell: bash
    steps:
      - name: Use LF line endings, symlinks and Git Bash for package scripts
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
          bash_path=$(cygpath -w /usr/bin/bash)
          echo "npm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
          echo "pnpm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm ci --prefix actions/docs --ignore-scripts --no-audit --no-fund
      - run: |
          vale_bin=$(actions/docs/install-vale.sh "$RUNNER_TEMP/vale")
          echo "VALE_BIN=$vale_bin" >> "$GITHUB_ENV"
      - run: npm test --prefix actions/docs
      - uses: ./actions/docs
