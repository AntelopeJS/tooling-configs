name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install
      - run: pnpm run checks

  docs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22.18.0", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --prefix actions/docs --ignore-scripts --no-audit --no-fund
      - run: npm test --prefix actions/docs
      - uses: ./actions/docs
