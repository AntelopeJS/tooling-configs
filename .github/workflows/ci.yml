name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install
      - run: pnpm run checks
      # `dist` is committed while consumers install this package straight from
      # git; a stale build would ship silently. Drop with the git-install path.
      - run: pnpm run check:dist
