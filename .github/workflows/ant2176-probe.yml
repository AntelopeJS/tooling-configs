name: ant2176-probe

on:
  pull_request:

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
          bash_path=$(cygpath -w /usr/bin/bash)
          echo "npm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
          echo "pnpm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install
      - run: |
          for f in src/guardrails/sync-interface-ranges.test.ts src/guardrails/checks-services.test.ts src/guardrails/sync-packed.test.ts; do
            echo "=== $f"
            if timeout 300 node --test --test-reporter=spec "$f" > out.txt 2>&1; then code=0; else code=$?; fi
            grep -vE '^\s+at ' out.txt | tail -150
            echo "=== exit $code $f"
          done
