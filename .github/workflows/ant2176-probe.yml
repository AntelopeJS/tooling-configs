name: ant2176-probe

on:
  pull_request:

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
          bash_path=$(cygpath -w /usr/bin/bash)
          echo "npm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
          echo "pnpm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install
      - run: node --test --test-timeout=300000 --test-reporter=tap src/guardrails/api-diff-cli-entries.test.ts src/guardrails/checks-verify.test.ts src/guardrails/sync-interface-ranges.test.ts src/guardrails/sync-template-scripts.test.ts src/oxc/lint-hidden-any.test.ts src/oxc/guardrails/self-import-lint.test.ts src/oxc/anti-slop/rules/no-module-mocking.test.ts src/oxc/anti-slop/rules/no-shape-in-symbol-names.test.ts src/oxc/guardrails/rules/no-comments.test.ts src/oxc/guardrails/rules/no-self-import-in-tests.test.ts
