name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      nightly:
        description: Run the nightly tier, with the Windows jobs and Stress
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Parallel jobs on Linux and Windows: the pull request waits for
# the slowest of them rather than for the sum of all steps. The branch
# rulesets require the `ubuntu` check, which aggregates them.
jobs:
  # `pnpm run checks`: typecheck, lint, format, knip, the backend and node
  # tests (one build), size, ratchet and sync.
  ci:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v2
    with:
      docs-files: |
        README.md
        docs
        playground/README.md
      cache-paths: |
        .antelope/cache
        ~/.cache/mongodb-binaries
      cache-key-files: |
        src/test/harness.ts
        pnpm-lock.yaml
      renovate-sync: false
      test-job: true
      # Builds and typechecks the frontend layer against the DMS layer from
      # the `@antelopejs/dms` devDependency: no running backend needed.
      extra-commands: pnpm test:frontend
      extra-commands-job: true
      nightly: ${{ inputs.nightly == true }}
    permissions:
      contents: read

  # Which journeys of e2e/ run: none on a draft, the @smoke ones on a ready
  # pull request, every journey in shards in the merge queue, nightly, on a
  # manual run and on a pull request labelled `ci:full`.
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      suite: ${{ steps.suite.outputs.suite }}
    steps:
      - name: Pick the e2e suite from the event, the draft flag and the labels
        id: suite
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          case "$EVENT" in
            pull_request)
              if [[ "$BASE_REF" == "$DEFAULT_BRANCH" && "$HEAD_REPOSITORY" == "$REPOSITORY" && "$HEAD_REF" =~ ^(next|develop)$ ]]; then
                suite=none
              elif [[ "$DRAFT" == true ]]; then
                suite=none
              elif [[ "$FULL_LABEL" == true ]]; then
                suite=all
              else
                suite=smoke
              fi
              ;;
            push)
              if [[ "$REF_NAME" == "$DEFAULT_BRANCH" ]]; then suite=none; else suite=smoke; fi
              ;;
            *) suite=all ;;
          esac
          echo "suite=${suite}" >> "$GITHUB_OUTPUT"
          echo "e2e suite \`${suite}\`" >> "$GITHUB_STEP_SUMMARY"

  # The journeys of e2e/ as a Playwright suite. Its global setup prepares and
  # starts one run per shard.
  e2e:
    needs: select
    if: needs.select.outputs.suite != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.suite == 'all' && '[1, 2]' || '[1]') }}
    env:
      SUITE: ${{ needs.select.outputs.suite }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: |
          echo "DMS_E2E_RUNS=${RUNNER_TEMP}/dms-runs" >> "$GITHUB_ENV"
      # Before setup-node: its pnpm cache resolves the store by running pnpm.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The playground's modules, the mongod binary and Chromium.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/mongodb-binaries
            ~/.cache/ms-playwright
            e2e/playground/.antelope/cache
          key: e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'e2e/playground/antelope.config.ts') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/dms-e2e/frontend
          key: dms-e2e-frontend-v2-${{ github.sha }}
          restore-keys: dms-e2e-frontend-v2-
      - name: Install Chromium and its system packages
        run: |
          if timeout 240 pnpm exec playwright install --with-deps --only-shell chromium; then
            exit 0
          fi
          echo "::warning::Chromium's system packages did not install: installing the browser alone"
          pnpm exec playwright install --only-shell chromium
      - if: env.SUITE == 'smoke'
        run: pnpm e2e --grep @smoke
      # The blob report keeps each test's steps, attachments and traces, so
      # e2e-report merges the shards into one.
      - if: env.SUITE == 'all'
        run: pnpm e2e --shard=${{ matrix.shard }}/2 --reporter=blob
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: e2e/blob-report
      - if: success() || failure()
        run: pnpm exec tsc --noEmit -p e2e
      - if: always() && env.SUITE == 'all'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: e2e/blob-report
          retention-days: 3
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-evidence-${{ matrix.shard }}
          path: |
            e2e/playwright-report
            e2e/test-results
            ${{ runner.temp }}/dms-runs/*/evidence
            ${{ runner.temp }}/dms-runs/*/logs
          retention-days: 7

  # One HTML and JSON report of the shards.
  e2e-report:
    needs: [select, e2e]
    if: always() && needs.select.outputs.suite == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: blob-report-*
          path: e2e/blob-reports
          merge-multiple: true
      - run: pnpm exec playwright merge-reports --reporter html,json e2e/blob-reports
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: e2e/playwright-report
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JSON_OUTPUT_FILE: e2e/playwright-report/results.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

  # The single check the branch rulesets require: green only when every job
  # above succeeded, or the event runs no e2e suite.
  ubuntu:
    if: always()
    needs: [select, ci, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: >-
          needs.select.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || needs.ci.result == 'skipped' || (needs.select.outputs.suite != 'none' && needs.e2e.result == 'skipped')
        run: exit 1
  renovate-sync:
    if: >-
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: write
      statuses: write
    uses: AntelopeJS/.github/.github/workflows/ci-renovate-sync.yml@v2
  verdict:
    needs: [ci, select, e2e, e2e-report, ubuntu, renovate-sync]
    if: ${{ !cancelled() }}
    runs-on: ${{ vars.RUNNER_CI || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail when a job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            echo "$failed"
            exit 1
          fi
