extends: capitalization
message: "Use sentence case in headings (unslop rule 17)."
level: warning
scope: heading
match: $sentence
exceptions:
  - "AntelopeJS"
  - "DMS"
  - "API"
  - "CLI"
  - "CI"
  - "HTTP"
  - "HTTPS"
  - "JSON"
  - "YAML"
  - "SQL"
  - "URL"
  - "README"
  - "Markdown"
  - "TypeScript"
  - "JavaScript"
  - "Node.js"
  - "MongoDB"
  - "PostgreSQL"
  - "RethinkDB"
  - "Redis"
  - "GitHub"
  - "Docker"
  - "Vue"
  - "Nuxt"
  - "Vale"
  - "Playwright"
  - "Diátaxis"
  - "OAuth"
  - "JWT"
  - "MDC"
  - "TLA+"
  - "npm"
  - "pnpm"
