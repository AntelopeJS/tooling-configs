pre-commit:
  commands:
    antelopejs-format:
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    antelopejs-lint:
      glob: "*.{js,mjs,cjs,jsx,ts,mts,cts,tsx,vue}"
      run: pnpm exec oxlint --no-error-on-unmatched-pattern {staged_files}
    antelopejs-size:
      run: node src/bin/check-size.ts --staged {staged_files}
    antelopejs-suppressions:
      glob: "*.{js,mjs,cjs,jsx,ts,mts,cts,tsx,vue}"
      run: node src/bin/suppressions.ts --staged
pre-push:
  commands:
    antelopejs-typecheck:
      run: pnpm run typecheck
